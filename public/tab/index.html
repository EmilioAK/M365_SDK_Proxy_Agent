<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Switcher</title>
    <style>
      :root {
        --bg: #0d1424;
        --panel: #111a2d;
        --text: #e8ecf5;
        --muted: #9fb1d1;
        --accent: #5ac8fa;
        --border: #1c2940;
        --success: #3dd598;
        --error: #ff6b6b;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 20% 20%, #1a2540, #0d1424 60%),
          radial-gradient(circle at 80% 0%, #16213a, transparent 40%);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        padding: 24px;
      }

      .card {
        width: min(780px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 24px 40px rgba(0, 0, 0, 0.35);
        padding: 24px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .status {
        margin: 16px 0;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status.info {
        color: var(--muted);
      }

      .status.success {
        color: var(--success);
        border-color: rgba(61, 213, 152, 0.35);
      }

      .status.error {
        color: var(--error);
        border-color: rgba(255, 107, 107, 0.35);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        margin-top: 12px;
      }

      button.agent {
        width: 100%;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.02);
        color: var(--text);
        padding: 14px;
        border-radius: 12px;
        cursor: pointer;
        text-align: left;
        font-size: 14px;
        transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
      }

      button.agent:hover {
        border-color: rgba(90, 200, 250, 0.5);
        background: rgba(90, 200, 250, 0.06);
        transform: translateY(-1px);
      }

      button.agent.selected {
        border-color: var(--accent);
        background: rgba(90, 200, 250, 0.12);
        box-shadow: 0 0 0 1px rgba(90, 200, 250, 0.2);
      }

      .agent-name {
        display: block;
        font-weight: 600;
      }

      .agent-meta {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header>
        <h1>Pick an agent</h1>
        <p>Route new chat messages to the agent you choose.</p>
      </header>

      <div id="status" class="status info">Loading agents…</div>
      <div id="agents" class="grid"></div>
    </main>

    <script src="https://res.cdn.office.net/teams-js/2.13.0/js/MicrosoftTeams.min.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
  </body>
</html>
